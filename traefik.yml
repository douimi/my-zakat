api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # Traefik v3 cuts any request whose body takes longer than 60 s to arrive.
    # A 50 MB completion report (invoices and photos bundled into one PDF) needs
    # about 7 Mbit/s of upload to beat that, which field teams rarely have, so
    # the upload died part-way with no useful error. 30 minutes covers a 100 MB
    # file at roughly 0.5 Mbit/s.
    #
    # The cost: a client that trickles a request body in slowly can now hold a
    # connection for up to 30 minutes instead of 60 s. That is the price of
    # accepting real uploads over slow links; it is bounded, and it applies to
    # this entry point only.
    transport:
      respondingTimeouts:
        readTimeout: 30m

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@myzakat.org
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik-network

log:
  level: INFO
  format: json

# JSON rather than the default common-log format, so Promtail can extract the
# request path and status as fields instead of positionally parsing a text line.
# The noise filtering lives in Promtail (monitoring/promtail/promtail-config.yml)
# because it is path-dependent — successful static-asset reads are dropped while
# every 4xx/5xx is kept — and Traefik's own filters cannot express that.
#
# Request headers are dropped: they carry cookies and Authorization, which must
# not be written to disk or shipped to Loki and retained for 30 days.
accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
